name: Build & Push Docker Image

on:
  # main 镜像等 CI 通过后再构建，避免为失败的提交产出可部署镜像。
  # workflow_run 的 GITHUB_SHA 是默认分支最新提交，构建时改用 workflow_run.head_sha。
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
    # 纯文档 / 元数据改动不重建镜像，省 runner 和构建时间。
    # 注意：paths 过滤对 tag 推送同样生效，若某个 v* tag 相对上一提交只改了这些文件，
    # 该次发布不会自动构建，届时用 workflow_dispatch 手动触发即可。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      purpose:
        description: 用途
        type: choice
        required: true
        default: edge
        options:
          - edge
          - patch
          - minor
          - major

# 同一 ref 重复推送时取消上一次未完成的构建，避免并发占满 runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # main 推送（CI 通过后）与手动触发：完整构建多架构镜像，产出 main / sha-<7> / edge。
  # 这些镜像不覆盖 latest，latest 只由正式发版 tag 推进。
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        # workflow_run 的默认 GITHUB_SHA 可能已随新提交前移，这里固定成 CI 实际验证的那次提交
        env:
          GITHUB_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' && inputs.purpose == 'edge' }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ (github.event_name == 'workflow_dispatch' && inputs.purpose == 'edge') && 'edge' || 'main' }}
            COMMIT=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 正式发版：同一次提交在 main 上已经构建过 sha-<7>，这里只做标签复制（秒级），不再重建。
  # main 侧构建尚未完成时先等待；确实没有（例如 tag 打在历史提交上）才回退到完整构建。
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute release tags
        id: tags
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

      - name: Wait for tested image
        id: src
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          sha_tag="sha-${GITHUB_SHA:0:7}"
          found=false
          for _ in $(seq 1 60); do
            if docker buildx imagetools inspect "$IMAGE:$sha_tag" >/dev/null 2>&1; then
              found=true
              break
            fi
            sleep 15
          done
          echo "sha_tag=$sha_tag" >> "$GITHUB_OUTPUT"
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Promote tested image
        if: ${{ steps.src.outputs.found == 'true' }}
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SHA_TAG: ${{ steps.src.outputs.sha_tag }}
          VERSION: ${{ steps.tags.outputs.version }}
          MINOR: ${{ steps.tags.outputs.minor }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" -t "$IMAGE:$MINOR" -t "$IMAGE:latest" \
            "$IMAGE:$SHA_TAG"

      # 回退路径：该提交没有可复用的 main 镜像时才真正构建多架构镜像。
      # 注意：走 promote（复制 sha 镜像）时，镜像里的 VERSION 仍是 main（构建时 tag 未知），
      # 这里回退构建才能把正式版本号写进二进制。
      - name: Build & push (fallback)
        if: ${{ steps.src.outputs.found != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.minor }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # workflow_dispatch + purpose∈{patch,minor,major}：先按已有 tag 算下一个版本号。
  # 结果通过 outputs 传给 create-tag，避免和手动打的 tag 撞车。
  resolve-tag:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.purpose != 'edge' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      next_tag: ${{ steps.compute.outputs.next_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next semver tag
        id: compute
        env:
          PURPOSE: ${{ inputs.purpose }}
        run: |
          set -euo pipefail
          last=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$last" ]; then
            next="v0.1.0"
          else
            ver="${last#v}"
            IFS=. read -r major minor patch <<<"$ver"
            case "$PURPOSE" in
              major) major=$((major+1)); minor=0; patch=0 ;;
              minor) minor=$((minor+1)); patch=0 ;;
              patch) patch=$((patch+1)) ;;
              *) echo "unknown purpose: $PURPOSE" >&2; exit 1 ;;
            esac
            next="v${major}.${minor}.${patch}"
          fi
          echo "next_tag=$next" >> "$GITHUB_OUTPUT"
          echo "上一个 tag：${last:-<无>} → 下一个：$next"

  # build 与 resolve-tag 都完成后再推 tag，确保 sha-<7> 镜像已就位，
  # 后续 release job 走 promote（复制）而不是回退全量构建。
  create-tag:
    needs: [build, resolve-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Push annotated tag
        env:
          NEXT_TAG: ${{ needs.resolve-tag.outputs.next_tag }}
          PURPOSE: ${{ inputs.purpose }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$NEXT_TAG" >/dev/null 2>&1; then
            echo "tag $NEXT_TAG 已存在，请先处理冲突" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT_TAG" -m "release: cut $NEXT_TAG via workflow_dispatch (purpose=$PURPOSE, sha=${SHA:0:7})" "$SHA"
          git push origin "refs/tags/$NEXT_TAG"
